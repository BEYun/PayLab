name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: xcode-27  # GitHub 미리보기 이미지 (macOS 27)
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer  # 로컬과 같은 Xcode (러너 기본값은 27.1)
      TUIST_VERSION: 4.216.0
      TUIST_SHA256: eef9b9b0c5722052cc54ec6e114bd557cfcf8f695e483fb39cb80d53959354fc  # 릴리스의 SHASUMS256.txt
    steps:
      - uses: actions/checkout@v7

      - name: Tuist 설치
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tuist.zip" "https://github.com/tuist/tuist/releases/download/$TUIST_VERSION/tuist.zip"
          echo "$TUIST_SHA256  $RUNNER_TEMP/tuist.zip" | shasum -a 256 -c -
          ditto -x -k "$RUNNER_TEMP/tuist.zip" "$RUNNER_TEMP/tuist"  # 프레임워크 심볼릭 링크 보존
          echo "$RUNNER_TEMP/tuist" >> "$GITHUB_PATH"

      - name: 프로젝트 생성
        run: tuist generate --no-open

      - name: 시뮬레이터 부팅
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '.devices["com.apple.CoreSimulator.SimRuntime.iOS-27-0"][] | select(.name == "iPhone 18 Pro") | .udid')
          xcrun simctl bootstatus "$UDID" -b  # 꺼진 시뮬레이터에서 첫 테스트가 실패하는 것 방지
          echo "DESTINATION=id=$UDID" >> "$GITHUB_ENV"
          echo "UDID=$UDID" >> "$GITHUB_ENV"  # 성능 수집(perf-report collect)이 hang·크래시를 이 시뮬레이터로 거른다

      - name: 측정 준비
        run: |
          mkdir -p .build
          echo "PERF_SINCE=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"  # 이 시각 이후의 hang·크래시만 수집

      - name: 빌드
        run: |
          set -o pipefail
          xcodebuild -workspace PayLab.xcworkspace -scheme PayLab -destination "$DESTINATION" -derivedDataPath .build/DerivedData -showBuildTimingSummary build-for-testing | tee .build/build.log

      - name: 테스트
        run: xcodebuild -workspace PayLab.xcworkspace -scheme PayLab -destination "$DESTINATION" -derivedDataPath .build/DerivedData test-without-building

      - name: 성능 수집
        if: always()  # 테스트가 실패해도 hang·크래시·느린 함수는 모은다
        continue-on-error: true  # 수집 실패가 CI 결과를 바꾸지 않는다 (보고 잡은 보고서가 없어도 돈다)
        run: |
          LOGS=()
          if [ -f .build/build.log ]; then LOGS=(--build-log .build/build.log); fi  # 빌드 전에 실패하면 로그가 없다
          python3 -I scripts/perf-report.py collect --since "$PERF_SINCE" --device "$UDID" --products .build/DerivedData/Build/Products/Debug-iphonesimulator ${LOGS[@]+"${LOGS[@]}"} --out .build/perf/report.json

      - name: 성능 보고서 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: .build/perf/report.json
          if-no-files-found: ignore

  perf-report:
    needs: build-and-test
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.author_association == 'OWNER') }}  # 빌드·테스트가 실패해도 돈다. PR은 소유자만
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read  # 최근 main 실행의 build-metrics 받기
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # PR 체크아웃은 병합 커밋이라 HEAD^1이 base

      - name: 성능 보고서 받기
        continue-on-error: true  # 빌드가 수집 전에 실패하면 artifact가 없다
        uses: actions/download-artifact@v8
        with:
          name: perf-report
          path: .build/perf

      - name: 빌드 측정값
        run: python3 -I scripts/perf-report.py ci-metrics --report .build/perf/report.json --run-id "${{ github.run_id }}" --out .build/perf/build-metrics.json

      - name: 최근 main 측정값 받기
        run: |
          mkdir -p baseline
          n=0
          for id in $(gh run list --workflow ci.yml --branch main --event push --status success --limit 20 --json databaseId --jq '.[].databaseId' | grep -vx "$GITHUB_RUN_ID"); do
            [ "$n" -ge 5 ] && break
            if gh run download "$id" -n build-metrics -D "baseline/$id"; then n=$((n + 1)); else echo "run $id: build-metrics 없음"; fi  # 없으면 다음 실행으로
          done
          echo "기준 $n개"

      - name: 보고 (PR)
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 -I scripts/perf-report.py report --input .build/perf/report.json --where pr --pr "$PR_NUMBER" --changed-from HEAD^1 --baseline-dir baseline --metrics .build/perf/build-metrics.json

      - name: 보고 (main)
        if: github.event_name == 'push'
        run: python3 -I scripts/perf-report.py report --input .build/perf/report.json --where main --baseline-dir baseline --metrics .build/perf/build-metrics.json

      - name: 측정값 요약
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f .build/perf/report.json ]; then
            echo "::warning::성능 보고서 없음 — 수집 실패 또는 수집 전 실패"
          fi
          {
            if [ ! -f .build/perf/report.json ]; then
              echo "**성능 보고서 없음 — 수집 실패 또는 수집 전 실패**"
              echo
            fi
            echo "| 이름 | 값 |"
            echo "|---|---|"
            if [ -f .build/perf/report.json ]; then
              jq -r '"| 성능 문제 | \(.problems | length) |",
                     "| 무시한 hang (우리 코드 없음) | \(.ignored_hangs) |"' .build/perf/report.json \
                || echo "| 성능 보고서 | 읽기 실패 |"
            fi
            if [ -f .build/perf/build-metrics.json ]; then  # 측정 단계가 실패하면 파일이 없다
              jq -r '"| 우리 코드 컴파일(초) | \(.swift_compile_s // "없음") |",
                     "| 시스템 모듈 준비(초) | \(.system_modules_s // "없음") |",
                     "| 정규화 값 | \(.ratio // "없음") |",
                     "| xcodebuild 첫 출력까지(초) | \(.xcodebuild_start_s // "없음") |",
                     "| 전체 빌드 단계(초) | \(.build_step_s // "없음") |"' .build/perf/build-metrics.json \
                || echo "| 빌드 측정값 | 읽기 실패 |"
            else
              echo "| 빌드 측정값 | 없음 |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 측정값 유효 확인
        id: valid
        if: github.event_name == 'push'
        run: echo "ok=$(jq -r '.swift_compile_s != null' .build/perf/build-metrics.json 2> /dev/null || echo false)" >> "$GITHUB_OUTPUT"  # 실패한 빌드·파일 없음은 기준이 되지 않는다

      - name: 측정값 올리기 (main)
        if: github.event_name == 'push' && steps.valid.outputs.ok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-metrics
          path: .build/perf/build-metrics.json

  claude-review:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened') && github.event.pull_request.author_association == 'OWNER'  # PR 열기·다시 열기, 소유자 PR만
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Claude 리뷰
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}  # Claude GitHub App 없이 github-actions[bot]으로 코멘트
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR을 리뷰하라. 기준은 저장소 CLAUDE.md의 규칙(모듈 의존, Domain import 금지, 화면 로직은 @Observable 모델)과 버그다.
            특정 줄의 문제는 인라인 코멘트로, 전체 요약은 `gh pr comment`로 한 번만 남긴다. 한국어로 짧게 쓴다.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Claude 오류 출력
        if: failure()
        run: jq -r '.[] | select(.type == "result") | .result // empty' "$RUNNER_TEMP/claude-execution-output.json"  # 액션이 숨기는 실패 문구만

  claude-ci-failure:
    needs: build-and-test
    if: failure() && github.event_name == 'pull_request' && github.event.pull_request.author_association == 'OWNER'  # PR 빌드·테스트 실패 시, 소유자 PR만
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      actions: read  # 실패 잡 로그 읽기
    steps:
      - uses: actions/checkout@v7

      - name: 실패 로그 받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JOB_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "build-and-test") | .id')
          gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" > ci-failure.log  # xcodebuild 색상 코드 때문에 필요

      - name: Claude 실패 분석
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR의 CI `build-and-test` 잡이 실패했다. 로그는 `ci-failure.log`(xcodebuild 출력, 길다)에 있다. `error:`, `✘`, `FAILED`부터 찾아라.
            소스를 읽고 실패 원인과 고치는 방법을 `gh pr comment`로 한 번만 남긴다. 코드는 고치지 않는다. 한국어로 짧게 쓴다.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh pr comment:*)"

      - name: Claude 오류 출력
        if: failure()
        run: jq -r '.[] | select(.type == "result") | .result // empty' "$RUNNER_TEMP/claude-execution-output.json"
